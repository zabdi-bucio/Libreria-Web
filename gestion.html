<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="formularios.css"> </head>
<body>
    <header>
        <h1>Gestión de Inventario</h1>
    </header>
    <nav>
        <a href="index.html">Volver al Inicio</a>
    </nav>
    <hr>
    <main>
        <h2>Altas, Modificaciones y Eliminación</h2>
        
        <form action="#" method="POST">
            <fieldset>
                <legend>Datos del Libro/Producto</legend>
                
                <label for="id_producto">ID o ISBN:</label>
                <input type="text" id="id_producto" name="id_producto" required>

                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" required>

                <label for="autor">Autor:</label>
                <input type="text" id="autor" name="autor">

                <label for="precio">Precio ($):</label>
                <input type="number" id="precio" name="precio" step="0.01">

                <label for="accion">Acción a realizar:</label>
                <select id="accion" name="accion">
                    <option value="alta">Dar de Alta</option>
                    <option value="modificar">Modificar</option>
                    <option value="eliminar">Eliminar (Baja)</option>
                </select>

                <button type="submit">Ejecutar Acción</button>
            </fieldset>
        </form>
    </main>
</body>
</html>
