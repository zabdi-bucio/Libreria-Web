<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="unsafe-url">
    <title>Librería BiblioTec</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/zabdi-bucio/Libreria-Web/estilos.css">
    
    <style>
        .bienvenida-caja {
            background-color: #1abc9c;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        #btn-magia {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
        }
        #btn-magia:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <header>
        <h1>Librería BiblioTec</h1>
        <img src="img/logo.png" width="200" alt="Logo BiblioTec">
    </header>

    <nav>
        <a href="index.html">Inicio</a> |
        <a href="mision.html">Misión</a> |
        <a href="vision.html">Visión</a> |
        <a href="catalogo.html">Catálogo</a> |
        <a href="contacto.html">Contacto</a> |
        <a href="gestion.html">Gestión de Productos</a> 
    </nav>

    <hr>

    <main id="contenido-principal">
        <p>Bienvenido al sitio web de BiblioTec. Tu librería de confianza.</p>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 BiblioTec.</p>
        
        <a href="https://validator.w3.org/nu/?doc=https://zabdi-bucio.github.io/Libreria-Web/index.html" target="_blank">
            <img src="img/valid_HTML5.png" alt="¡HTML 5 Válido!" height="31" width="88" style="border:0;">
        </a>

        <a href="https://jigsaw.w3.org/css-validator/validator?uri=https://zabdi-bucio.github.io/Libreria-Web/index.html" target="_blank">
            <img src="img/valid_CSS.png" alt="¡CSS Válido!" height="31" width="88" style="border:0;">
        </a>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function(){
            let boton = '<button id="btn-magia">Descubre nuestra oferta de hoy</button>';
            let caja = '<div class="bienvenida-caja">¡Hoy tenemos 20% de descuento en todos los libros de programación!</div>';
            
            $("#contenido-principal").append(boton).append(caja);

            $("#btn-magia").click(function(){
                $(".bienvenida-caja").slideToggle("fast");
            });
        });
    </script>
</body>
</html>
